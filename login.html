<!DOCTYPE html>
<html lang="th">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/login.js" defer></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Lost & Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page">
    
    <div class="auth-wrapper">
        <div class="auth-card card">
            <div class="auth-header">
                <img src="images/logo.jpg" alt="Logo" class="auth-logo" onerror="this.style.display='none'">
                <h2>เข้าสู่ระบบ</h2>
                <p>ระบบบริหารจัดการและแจ้งของหาย-ของที่พบ</p>
            </div>
            
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label>อีเมลสถาบัน</label>
                    <input type="email" id="login-email" placeholder="example@up.ac.th">
                </div>
                <div class="form-group">
                    <label>รหัสผ่าน</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-pass" placeholder="••••••••">
                        <span class="toggle-password" onclick="togglePassword('login-pass', this)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </span>
                    </div>
                </div>
                
                <button type="submit" class="full-width-btn-large">เข้าสู่ระบบ</button>
            </form>
            
            <div class="auth-footer">
                <p>ยังไม่มีบัญชีใช่หรือไม่? <a href="register.html" class="action-link">สมัครสมาชิก</a></p>
                <a href="index.html" class="action-link" style="color: var(--text-muted); font-size: 0.8rem; margin-top: 10px;">กลับสู่หน้าหลัก</a>
            </div>
        </div>
    </div>
</body>
</html>
